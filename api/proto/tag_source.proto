syntax = "proto3";

package tagplugin;

option go_package = "go-music-tag/api/proto/tagplugin";

// --- Tag source plugin (music metadata) ---

// Song is the normalized music-metadata record returned by every tag source.
message Song {
  string id = 1;
  string name = 2;
  string artist = 3;
  string artist_id = 4;
  string album = 5;
  string album_id = 6;
  string album_img = 7;
  string year = 8;
  string source = 9; // populated by gateway handler, not the plugin itself
  string genre = 10;
  string mid = 11;
  string cover = 12;
  double score = 13; // populated by smart_tag aggregation
  // Track length in SECONDS, normalized by each plugin before it gets
  // here. Upstream units are not consistent — NetEase reports
  // milliseconds, QQ/Kugou/Kuwo/Migu seconds — so the conversion belongs
  // in the plugin, not in every consumer. 0 means "unknown": MusicBrainz
  // search results carry no length, and that is a normal empty, not an
  // error.
  double duration = 14;
}

message SearchRequest {
  string query = 1;
  int32 page = 2;   // 1-indexed
  int32 limit = 3;
}

message SearchResponse {
  repeated Song songs = 1;
  bool has_more = 2;
}

message FetchId3Request {
  string title = 1;
}

message FetchId3Response {
  repeated Song songs = 1;
}

message FetchLyricRequest {
  string song_id = 1;
}

message FetchLyricResponse {
  string lyric = 1;
}

// GetAudioRequest / GetAudioResponse are the dynamic audio-stream URL
// fetcher contract. Plugins know their own identity (each gRPC process
// implements ONE source), so the request carries only the song id. The
// response URL is usually short-lived and referer / cookie gated — the
// gateway will re-fetch the upstream bytes on the user's behalf so a
// browser can do Range scrubbing without CORS noise.
message GetAudioRequest {
  string id = 1;
}

message GetAudioResponse {
  string url = 1;
}

message PluginInfoRequest {}

message PluginInfoResponse {
  string name = 1;
  string display_name = 2;
  bool supports_search = 3;
  bool supports_lyric = 4;
  bool supports_id3 = 5;
  // supports_audio_url is true if the source answers GetAudioURL with a
  // playable upstream URL. Musicbrainz / AcoustID will report false; the
  // remaining 5 mainstream sources report true once their implementation
  // lands. Frontend can use this flag to choose between PlayButton
  // (direct URL) and the /api/stream proxy fallback.
  bool supports_audio_url = 6;
}

// TagSource handles metadata search + ID3 lookup + lyric fetch for a single
// music platform. One process can register many tag sources (each with its
// own gRPC server) and they all share this single interface.
service TagSource {
  rpc GetPluginInfo(PluginInfoRequest) returns (PluginInfoResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc FetchId3ByTitle(FetchId3Request) returns (FetchId3Response);
  rpc FetchLyric(FetchLyricRequest) returns (FetchLyricResponse);
  // GetAudioURL returns a short-lived upstream audio-stream URL (empty
  // when the source is metadata-only, e.g. musicbrainz / acoustid, in
  // which case PluginInfoResponse.supports_audio_url is false).
  rpc GetAudioURL(GetAudioRequest) returns (GetAudioResponse);
}
