version: '3'

# =============================================================================
# Music Tag Web - 本地构建 (local) 版 docker-compose
# -----------------------------------------------------------------------------
# 用法:
#   1) 把 MUSIC_DIR 和 DATA_DIR 改成你自己的本地路径（也可在 .env 文件里设置）
#      - MUSIC_DIR: 你的本地音乐文件夹，会挂载到容器内的 /app/media
#                   (nginx 通过 /media/music/ 直接高效提供音频)
#      - DATA_DIR : 持久化 sqlite 数据库，建议独立空目录
#   2) 启动:
#        docker compose -f docker-compose.local.yml up -d --build
#      首次启动会自动:
#        - pip wheel 安装 base.txt 依赖
#        - python manage.py migrate (建表)
#        - python manage.py setup_in_docker.py (创建 admin 用户)
#        - gunicorn 监听 0.0.0.0:8001
#   3) 浏览器打开 http://localhost:9150/admin
#      默认账号 admin/admin (务必修改)
#   4) 查看日志:
#        docker compose -f docker-compose.local.yml logs -f
#   5) 重启应用（代码已 baked 进镜像，需重建才能生效）:
#        docker compose -f docker-compose.local.yml up -d --build
# =============================================================================

services:
  django:
    build:
      context: .
      dockerfile: compose/local/django/Dockerfile
      args:
        # local 模式读取 requirements/local.txt -> -r base.txt
        BUILD_ENVIRONMENT: local
    image: music-tag-web:local
    container_name: music-tag-web
    expose:
      - "8001"
    volumes:
      # 挂载音乐目录（修改 MUSIC_DIR 指向你自己的路径）
      - ${MUSIC_DIR:-./music}:/app/media:rw
      # 挂载持久化目录（sqlite / 上传封面 / celery schedule）
      # local_settings.py 把 sqlite 指向 /app/data/db.sqlite3
      - ${DATA_DIR:-./data}:/app/data:rw
      # 注入针对本地 docker 的 settings override
      - ./compose/local/django/local_settings.py:/app/music_site/local_settings.py:ro
    environment:
      # settings.py 中有这个环境变量判断，本地 sqlite 模式下无需 redis/mysql
      # 保留以备日后切换 MySQL/Redis 时一致
      dockerrun: "yes"
      # 默认开启 DEBUG 方便本地调试；想关掉时在 .env 里设 DJANGO_DEBUG=0 即可
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    restart: unless-stopped    healthcheck:
      # python:<ver>-slim 默认不装 curl；用 python 内置 urllib 做 HTTP 探活，
      # 这样无需改 Dockerfile 安装额外的 curl/apt 包；额外验证 /admin/login/ 返回 200
      # 而不是仅看端口是否监听。
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8001/admin/login/', timeout=5); sys.exit(0) if r.status==200 else sys.exit(1)"] 
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - mtweb

  nginx:
    image: nginx:1.25-alpine
    container_name: music-tag-nginx
    ports:
      - "${NGINX_PORT:-9150}:80"
    depends_on:
      django:
        # 等 django 健康检查通过后再启 nginx，避免启动期 502
        condition: service_healthy
    volumes:
      # 让 nginx 高效提供音频文件
      - ${MUSIC_DIR:-./music}:/app/media:ro
      # 使用修正后的本地版 nginx 配置: 把 proxy_pass 指向 django 容器
      - ./compose/local/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - mtweb

networks:
  mtweb:
