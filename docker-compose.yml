      start_period: 15s
    environment:
      MUSICBRAINZ_PORT: "${MUSICBRAINZ_PORT:-50056}"
      MUSICBRAINZ_HEALTH_PORT: "18086"
    restart: unless-stopped

  acoustid:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      additional_contexts:
        fpcalbase: "service:fpcalc-base"
      args:
        PLUGIN: acoustid
        # The only plugin that needs fpcalc; see Dockerfile.base.
        RUNTIME_BASE: runtime_fpcalc
    container_name: go-music-acoustid
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${ACOUSTID_PORT:-50057}"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18087/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      ACOUSTID_PORT: "${ACOUSTID_PORT:-50057}"
      ACOUSTID_HEALTH_PORT: "18087"
      # 未设时回退到官方公共测试 key（官方声明会在数日后过期）。长期部署
      # 请在 https://acoustid.org/login 注册后把真 key 写进 .env。
      ACOUSTID_API_KEY: "${ACOUSTID_API_KEY:-}"
    volumes:
      # The only plugin that reads the audio itself: fpcalc has to open the
      # file, and it is handed the path exactly as gateway/worker see it
      # (/app/media/...). Without this mount fpcalc fails to open every
      # path and the plugin returns an empty result, which is
      # indistinguishable from "AcoustID had no match". Mounted read-only —
      # fingerprinting never writes.
      - ./music:/app/media:ro
    restart: unless-stopped

  youtube:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: youtube
    container_name: go-music-youtube
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${YOUTUBE_PORT:-50058}"
    # The youtube plugin is the process that actually RUNS yt-dlp and writes
    # the audio file (internal/plugin/youtube/server.go::tmpDir →
    # $AUDIO_CACHE_DIR/youtube). It must therefore share the same volume as
    # gateway + worker:
    #   - gateway globs <cache>/youtube/<id>.* to ServeFile the preview and
    #     reads <id>.error to fail-closed instead of looping 202;
    #   - worker os.Stat()s the plugin-reported FilePath and copies it into
    #     MUSIC_DIR for the "加入库" path.
    # Without this mount the plugin wrote into its own container layer, so
    # every download "succeeded" while both consumers saw an empty directory —
    # surfacing to the user as a bogus "下载超时". See REVIEW.md P0-1.
    volumes:
      - audio-cache:/tmp/audio_cache
    environment:
      # MUST match gateway + worker (and the audioCacheDir defaults in
      # internal/tasks/yt_dl.go / internal/gateway/handler/stream.go).
      AUDIO_CACHE_DIR: /tmp/audio_cache
      YOUTUBE_PORT: "${YOUTUBE_PORT:-50058}"
      YOUTUBE_HEALTH_PORT: "18088"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  redis-data:
  audio-cache:
