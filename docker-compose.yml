# =============================================================================
# Music Tag Web - Go 后端（项目根，gRPC 插件架构）
# 分布式布局：gateway + worker + 8 个 gRPC 音源插件。
#
# 服务清单：
#   gateway      - gin-gonic HTTP 服务器：API + 静态 SPA + 媒体（容器内端口 8001，通过 ${GATEWAY_PORT:-9150} 暴露到宿主机）
#   worker       - asynq 后台任务处理器
#   redis        - asynq 的消息代理
#   netease/kugou/kuwo/migu/qmusic/musicbrainz/acoustid/youtube - 各音源的 gRPC 插件服务
# =============================================================================

services:
  # Shared runtime base for the three images that fingerprint audio.
  #
  # This is not a service anyone talks to. It exists so Dockerfile.gateway,
  # Dockerfile.worker and the acoustid plugin can all `FROM` it, which is what
  # makes the 88 MB of ffmpeg libraries that chromaprint drags in a single
  # stored layer instead of three. See Dockerfile.base for why repeating the
  # same `apk add` line three times does not achieve that.
  #
  # `scale: 0` is what keeps it out of `docker ps`: the image still gets
  # built, no container is created. The two obvious alternatives do not work.
  # A `profiles:` entry would be tidier, but `additional_contexts:
  # service:fpcalc-base` cannot resolve a service that a profile has excluded,
  # so the three consumers would fail to build. Giving it a `sleep infinity`
  # command works, at the cost of a container that exists only to occupy a
  # line in `docker ps`.
  #
  # No container_name here on purpose: it would conflict with scaling to zero.
  fpcalc-base:
    image: music-tag-web-fpcalc-base
    build:
      context: .
      dockerfile: Dockerfile.base
    scale: 0

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      additional_contexts:
        fpcalbase: "service:fpcalc-base"
    container_name: go-music-gateway
    # gateway 现在直接对外提供 API + 静态资源 + 媒体服务；宿主机侧端口经
    # 环境变量 GATEWAY_PORT（默认 9150）映射。容器内端口保持 8001，因为
    # healthcheck 中 /admin/login/ 使用的是该端口。
    ports:
      - "${GATEWAY_PORT:-9150}:8001"
    volumes:
      - ./music:/app/media:rw
      - ./data:/app/data:rw
      # NOTE: no ./static mount — the React SPA is baked into the gateway
      # image by Dockerfile.gateway's `frontend` stage. Re-adding a host
      # mount here would shadow /app/static/dist with an empty dir and
      # make `/` return "SPA not built".
      # Shared with worker so /api/stream long-poll can see yt-dlp output.
      - audio-cache:/tmp/audio_cache
    environment:
      # JWT_SECRET / ADMIN_USERS / WEBHOOK_INTERNAL_TOKEN 故意默认为空，
      # 让 gateway 在首次启动时执行自动引导（见 internal/config/bootstrap.go），
      # 生成加密随机值并写入 /app/data/.bootstrap-creds（该目录 bind mount
      # 自宿主机 ./data）。明文管理员密码会在启动日志里打印一次——
      # `docker compose logs gateway | grep FIRST-BOOT`。若要手动固定
      # 值，可以在 .env 中设置并取消下方对应行的注释；自动引导会
      # 跳过任何已经有值的 env。
      JWT_SECRET: ${JWT_SECRET:-}
      # 由 handler/auth.go::loadUsers 通过 os.Getenv() 读取。
      # 格式：user:pass[,user:pass...]（生产请使用 bcrypt 哈希）。
      ADMIN_USERS: ${ADMIN_USERS:-admin:admin} # 首次启动自动生成一对 bcrypt admin:<随机密码>
      # 由 middleware/cors.go 通过 os.Getenv() 读取。
      # 空列表将完全屏蔽跨域请求。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 由 plugin/grpc_adapter.go::DialOptions 通过 os.Getenv() 读取。
      GRPC_USE_TLS: ${GRPC_USE_TLS:-0}
      GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-}
      # 由 middleware/webhook_auth.go 通过 os.Getenv() 读取。
      # worker 在向 /api/webhooks/* POST 时通过 X-Internal-Token 头带上。
      # 空 = 默认拒绝（403）；除非 ALLOW_INSECURE_DEFAULTS=1 才会放行。
      WEBHOOK_INTERNAL_TOKEN: ${WEBHOOK_INTERNAL_TOKEN:-} # 自动引导（32 字节 hex）；为空时默认拒绝
      # 由 config.Load() 通过 os.Getenv() 读取。仅用于本地开发，
      # 显式设为 1 以跳过占位 JWT / admin/admin 默认值。
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-}
      # 与上方宿主机 ./music:/app/media 与 ./data:/app/data bind mount 对应；
      # 修改请同步调整宿主机挂载目标。
      MUSIC_DIR: /app/media
      DATA_DIR: /app/data
      DB_DSN: /app/data/db.sqlite3
      DB_DRIVER: ${DB_DRIVER:-sqlite3}
      REDIS_ADDR: redis:6379
      # MUST match worker (and yt_dl.go / stream.go audioCacheDir defaults).
      AUDIO_CACHE_DIR: /tmp/audio_cache
      # 各插件的 gRPC 地址。服务启动时通过 parsePluginAddrs() 读取。
      # 若插件以独立进程或在不同宿主机上运行，请相应调整。
      PLUGIN_NETEASE_ADDR: ${PLUGIN_NETEASE_ADDR:-netease:50051}
      PLUGIN_KUGOU_ADDR: ${PLUGIN_KUGOU_ADDR:-kugou:50052}
      PLUGIN_KUWO_ADDR: ${PLUGIN_KUWO_ADDR:-kuwo:50053}
      PLUGIN_MIGU_ADDR: ${PLUGIN_MIGU_ADDR:-migu:50054}
      PLUGIN_QMUSIC_ADDR: ${PLUGIN_QMUSIC_ADDR:-qmusic:50055}
      PLUGIN_MUSICBRAINZ_ADDR: ${PLUGIN_MUSICBRAINZ_ADDR:-musicbrainz:50056}
      PLUGIN_ACOUSTID_ADDR: ${PLUGIN_ACOUSTID_ADDR:-acoustid:50057}
      PLUGIN_YOUTUBE_ADDR: ${PLUGIN_YOUTUBE_ADDR:-youtube:50058}
    restart: unless-stopped
    # REVIEW.md P1-5: the gateway registers tag sources at boot with a
    # single 5s blocking dial per plugin. A plugin not yet accepting is
    # skipped for the rest of the process lifetime — ListTagSources()
    # reports only registered keys, so nothing retries. Waiting on
    # service_healthy makes the ordering explicit instead of racy.
    depends_on:
      redis:
        condition: service_started
      netease:
        condition: service_healthy
      kugou:
        condition: service_healthy
      kuwo:
        condition: service_healthy
      migu:
        condition: service_healthy
      qmusic:
        condition: service_healthy
      musicbrainz:
        condition: service_healthy
      acoustid:
        condition: service_healthy
      youtube:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/admin/login/"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      additional_contexts:
        fpcalbase: "service:fpcalc-base"
    container_name: go-music-worker
    volumes:
      - ./music:/app/media:rw
      - ./data:/app/data:rw
      # Shared with gateway so StreamAudio can ServeFile after yt-dlp lands.
      - audio-cache:/tmp/audio_cache
    environment:
      REDIS_ADDR: redis:6379
      # 与上方宿主机 ./music:/app/media 与 ./data:/app/data bind mount 对应；
      # 修改请同步调整宿主机挂载目标。
      MUSIC_DIR: /app/media
      DATA_DIR: /app/data
      DB_DSN: /app/data/db.sqlite3
      DB_DRIVER: ${DB_DRIVER:-sqlite3}
      AUDIO_CACHE_DIR: /tmp/audio_cache
      # Same plugin map as gateway (download:generic youtube branch uses
      # local yt-dlp, but other tasks may dial plugins later).
      PLUGIN_NETEASE_ADDR: ${PLUGIN_NETEASE_ADDR:-netease:50051}
      PLUGIN_KUGOU_ADDR: ${PLUGIN_KUGOU_ADDR:-kugou:50052}
      PLUGIN_KUWO_ADDR: ${PLUGIN_KUWO_ADDR:-kuwo:50053}
      PLUGIN_MIGU_ADDR: ${PLUGIN_MIGU_ADDR:-migu:50054}
      PLUGIN_QMUSIC_ADDR: ${PLUGIN_QMUSIC_ADDR:-qmusic:50055}
      PLUGIN_MUSICBRAINZ_ADDR: ${PLUGIN_MUSICBRAINZ_ADDR:-musicbrainz:50056}
      PLUGIN_ACOUSTID_ADDR: ${PLUGIN_ACOUSTID_ADDR:-acoustid:50057}
      PLUGIN_YOUTUBE_ADDR: ${PLUGIN_YOUTUBE_ADDR:-youtube:50058}
      GRPC_USE_TLS: ${GRPC_USE_TLS:-0}
      GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-}
      WEBHOOK_INTERNAL_TOKEN: ${WEBHOOK_INTERNAL_TOKEN:-}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-}
    restart: unless-stopped
    # REVIEW.md P1-5: wait for every plugin to report healthy before the
    # worker registers sources. Registration dials each plugin once with a
    # 5s blocking dial; a plugin that is not yet accepting is skipped
    # permanently, because ListTagSources() reports only registered keys
    # and no lazy retry path ever revisits it. service_healthy on a real
    # /healthz is what turns that race into an ordering guarantee.
    depends_on:
      redis:
        condition: service_started
      netease:
        condition: service_healthy
      kugou:
        condition: service_healthy
      kuwo:
        condition: service_healthy
      migu:
        condition: service_healthy
      qmusic:
        condition: service_healthy
      musicbrainz:
        condition: service_healthy
      acoustid:
        condition: service_healthy
      youtube:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: go-music-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data

  netease:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: netease
    container_name: go-music-netease
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${NETEASE_PORT:-50051}"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      NETEASE_PORT: "${NETEASE_PORT:-50051}"
      NETEASE_HEALTH_PORT: "18081"
    restart: unless-stopped

  kugou:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: kugou
    container_name: go-music-kugou
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${KUGOU_PORT:-50052}"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      KUGOU_PORT: "${KUGOU_PORT:-50052}"
      KUGOU_HEALTH_PORT: "18082"
    restart: unless-stopped

  kuwo:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: kuwo
    container_name: go-music-kuwo
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${KUWO_PORT:-50053}"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18083/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      KUWO_PORT: "${KUWO_PORT:-50053}"
      KUWO_HEALTH_PORT: "18083"
    restart: unless-stopped

  migu:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: migu
    container_name: go-music-migu
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${MIGU_PORT:-50054}"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      MIGU_PORT: "${MIGU_PORT:-50054}"
      MIGU_HEALTH_PORT: "18084"
    restart: unless-stopped

  qmusic:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: qmusic
    container_name: go-music-qmusic
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${QMUSIC_PORT:-50055}"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18085/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      QMUSIC_PORT: "${QMUSIC_PORT:-50055}"
      QMUSIC_HEALTH_PORT: "18085"
    restart: unless-stopped

  musicbrainz:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: musicbrainz
    container_name: go-music-musicbrainz
    # REVIEW.md P3-11: `expose` and the plugin's own <PLUGIN>_PORT env used to
    # be two copies of one number kept in sync by hand — compose passed no
    # <PLUGIN>_PORT at all, so every plugin silently fell back to the
    # hardcoded default in cmd/plugins/*/main.go. Both now read the same
    # variable, so changing it in .env moves them together. (Compose cannot
    # nest interpolations, so the matching PLUGIN_*_ADDR on gateway/worker
    # still has to be set by hand when a port changes.)
    expose:
      - "${MUSICBRAINZ_PORT:-50056}"
    # REVIEW.md P1-5: without this the container reports "running" the
    # moment the process exists, which is before Serve() accepts and with
    # no signal at all if the plugin then dies on a bad config. gateway and
    # worker dial each plugin ONCE with a 5s blocking dial at boot; a
    # plugin that misses that window is absent from the registry for the
    # rest of the process lifetime, because ListTagSources() reports only
    # registered keys and nothing retries. The health endpoint
    # (plugin.StartHealthServer) is what `depends_on: service_healthy`
    # below waits on.
