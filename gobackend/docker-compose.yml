version: "3"

# =============================================================================
# Music Tag Web - Go Backend (gobackend)
# Distributed architecture with gRPC plugin services.
#
# Services:
#   gateway      - gin-gonic REST API server (port 8001)
#   worker       - asynq background task processor
#   redis        - message broker for asynq
#   netease      - NetEase Cloud Music gRPC plugin
#   kugou        - KuGou Music gRPC plugin
#   nginx        - reverse proxy (port 9150)
# =============================================================================

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: go-music-gateway
    expose:
      - "8001"
    volumes:
      - ${MUSIC_DIR:-./music}:/app/media:rw
      - ${DATA_DIR:-./data}:/app/data:rw
    environment:
      GATEWAY_PORT: "8001"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MUSIC_DIR: /app/media
      DATA_DIR: /app/data
      DB_DSN: /app/data/db.sqlite3
      REDIS_ADDR: redis:6379
      PLUGIN_NETEASE_ADDR: netease:50051
      PLUGIN_KUGOU_ADDR: kugou:50052
      PLUGIN_KUWO_ADDR: kuwo:50053
      PLUGIN_MIGU_ADDR: migu:50054
      PLUGIN_QMUSIC_ADDR: qmusic:50055
      PLUGIN_MUSICBRAINZ_ADDR: musicbrainz:50056
      PLUGIN_ACOUSTID_ADDR: acoustid:50057
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/admin/login/"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: go-music-worker
    volumes:
      - ${MUSIC_DIR:-./music}:/app/media:rw
      - ${DATA_DIR:-./data}:/app/data:rw
    environment:
      REDIS_ADDR: redis:6379
      MUSIC_DIR: /app/media
      DATA_DIR: /app/data
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: go-music-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data

  netease:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: netease
    container_name: go-music-netease
    expose:
      - "50051"
    restart: unless-stopped

  kugou:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: kugou
    container_name: go-music-kugou
    expose:
      - "50052"
    restart: unless-stopped

  kuwo:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: kuwo
    container_name: go-music-kuwo
    expose:
      - "50053"
    restart: unless-stopped

  migu:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: migu
    container_name: go-music-migu
    expose:
      - "50054"
    restart: unless-stopped

  qmusic:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: qmusic
    container_name: go-music-qmusic
    expose:
      - "50055"
    restart: unless-stopped

  musicbrainz:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: musicbrainz
    container_name: go-music-musicbrainz
    expose:
      - "50056"
    restart: unless-stopped

  acoustid:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN: acoustid
    container_name: go-music-acoustid
    expose:
      - "50057"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: go-music-nginx
    ports:
      - "${NGINX_PORT:-9150}:80"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ${MUSIC_DIR:-./music}:/app/media:ro
      - ${STATIC_DIR:-../static}:/app/static:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  redis-data:
