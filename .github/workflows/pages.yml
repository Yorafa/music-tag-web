name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# A newer push to master always wins over an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build SPA + deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # GitHub Pages serves a project site from /<repo>/, so asset URLs in
      # the build need this prefix. Nothing else does: the /api/ literals
      # in the bundle stay root-absolute and are left to fail, because a
      # showcase has no backend to point them at.
      PAGES_BASE: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same major as the frontend stage in Dockerfile.gateway, so the
          # bundle is produced by the same toolchain the image ships.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        # tsc -b is the first half of the project's own `build` script. Run
        # it here so a type error fails the deploy instead of shipping.
        working-directory: frontend
        run: npm run typecheck

      - name: Build the real frontend
        # --base overrides the repo default (/static/dist/) for the Pages
        # root without editing vite.config.ts; --outDir keeps the Pages
        # artifact out of static/dist, which the gateway image owns.
        working-directory: frontend
        run: npx vite build --base="$PAGES_BASE" --outDir=../dist-pages --emptyOutDir

      - name: Inject showcase entry script
        # App.tsx renders LoginPage or HomePage and nothing else, so a
        # showcase published without a token in storage is a login form.
        # The script exits non-zero if its own output does not contain the
        # token key, because that failure is otherwise invisible.
        run: node demo/inject-demo.mjs dist-pages

      - name: Verify artifact
        run: |
          set -euo pipefail
          count=$(find dist-pages -type f | wc -l)
          echo "Files in dist-pages/: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::empty build output — refusing to publish"
            exit 1
          fi
          if [ ! -f dist-pages/index.html ]; then
            echo "::error::missing dist-pages/index.html"
            exit 1
          fi
          # The entry script is the whole difference between "a page you
          # can look at" and "a login form", so assert it survived the
          # build rather than trusting the previous step's exit code.
          if ! grep -q 'auth.accessToken' dist-pages/index.html; then
            echo "::error::showcase entry script missing from index.html"
            exit 1
          fi
          # Nothing may intercept requests any more: a service worker
          # would quietly start answering /api/* and the showcase would
          # present invented data as if it were real.
          if [ -f dist-pages/sw.js ] || [ -f dist-pages/mockServiceWorker.js ]; then
            echo "::error::worker script in artifact — the showcase must not serve data"
            exit 1
          fi
          if grep -rq 'serviceWorker' dist-pages/; then
            echo "::error::artifact still references serviceWorker — the showcase must not intercept requests"
            exit 1
          fi
          # The showcase must stay self-contained: every asset is bundled,
          # so an external stylesheet or script means link rot waiting to
          # happen on a public page.
          if grep -rqE '<(script|link)[^>]+(src|href)=["'"'"']https?://' dist-pages/; then
            echo "::error::external asset reference found — the Pages build must stay self-contained"
            exit 1
          fi
          echo "Artifact looks publishable."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
