version: '3'

services:
  redis:
    image: redis:latest
    restart: always
    container_name: music_redis
    networks:
      - internal
    expose:
      - "6379"
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: music3
      MYSQL_ROOT_PASSWORD: 123456
    networks:
      - internal
    expose:
      - "3306"
  nginx:
    image: nginx:latest
    restart: always
    container_name: music_nginx
    ports:
      - "9150:80"
    networks:
      - internal
    depends_on:
      - redis
    volumes:
      - /Users/macbookair/Music/nginx.conf:/etc/nginx/nginx.conf:ro # 配置nginx.conf
      - /Users/macbookair/Music/my_music:/app/media:z # 配置本地音乐文件夹
networks:
  internal: