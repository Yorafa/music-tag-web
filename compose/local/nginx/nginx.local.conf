# =============================================================================
# Music Tag Web - Local docker nginx 配置
# ----------------------------------------------------------------------------
# 修正项 (vs 项目自带的 compose/local/nginx/nginx.conf):
#   - proxy_pass http://127.0.0.1:8001  -> http://django:8001  (容器名)
#   - 删除 macOS 硬编码的 root 指令
#   - 删掉 include servers/*; (避免容器内找不到目录报错)
# =============================================================================

worker_processes  4;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  20480;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_proxied       any;
    gzip_vary          on;
    gzip_types
        application/javascript
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    upstream django_upstream {
        server django:8001;
    }

    server {
        listen       80;
        server_name  _;

        client_max_body_size 100M;

        location / {
            proxy_pass http://django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 直接服务音乐文件，方便外链播放
        location /media/music {
            alias /app/media/music/;
            autoindex on;
            add_header Accept-Ranges bytes;
        }

        # 上传的附件（封面、LRC 等）
        location /media/attachments {
            alias /app/media/attachments;
            autoindex on;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            return 500;
        }
    }
}
